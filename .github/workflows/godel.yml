name: Gödel calculus

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "src/bin/godel.rs"
      - "src/lib.rs"
      - "vendor/vox/src/godel_calculus.rs"
      - "vendor/vox/src/lib.rs"
      - ".github/workflows/godel.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test vendored Vox calculus
        run: cargo test --manifest-path vendor/vox/Cargo.toml --lib godel_calculus
      - name: Run g-mOMonadOS calculus self-test
        run: cargo run --bin godel -- selftest
