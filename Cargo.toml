[package]
name = "g-momonados"
version = "0.1.0"
edition = "2021"
autobins = false

[dependencies]
libm = "0.2"
num-bigint = { version = "0.4", default-features = false }
num-traits = { version = "0.2", default-features = false, features = ["libm"] }
imasm_core = { path = "../MoDoT/imasm_core", default-features = false }
vox_core = { path = "../Vox", package = "vox", default-features = false }
# The batched SIXTEEN_3/catalog/crystal GPU kernels this build exists for.
cudarc = { version = "=0.19.9", optional = true, default-features = false, features = ["driver", "nvrtc", "cuda-12040", "dynamic-loading", "std"] }
# gpu_imasm_cycle.rs reads real ob3ect JSON files off disk.
serde_json = { version = "1", optional = true, features = ["arbitrary_precision", "float_roundtrip"] }
serde = { version = "1", optional = true, features = ["derive"] }

# The Cargo host build constructs the same resident modules used by the target.
[build-dependencies]
libm = "0.2"
num-bigint = { version = "0.4", default-features = false }
num-traits = { version = "0.2", default-features = false, features = ["libm"] }
imasm_core = { path = "../MoDoT/imasm_core", default-features = false }
vox_core = { path = "../Vox", package = "vox", default-features = false }
cudarc = { version = "=0.19.9", default-features = false, features = ["driver", "nvrtc", "cuda-12040", "dynamic-loading", "std"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }

[features]
carrier-observation = ["vox_core/carrier-profile"]
# Opt in only when compiling the static resident binary for a static target.
resident-static = ["hosted"]
# G-mOMonadOS is mOMonadOS ported to run as a GPU-native build: hosted is
# not an opt-in mode here, it is the only mode, on by default so plain
# `cargo build` (no --target, no --features) produces the binary that
# actually runs. The `hosted`-gated / `not(hosted)`-gated split throughout
# the source is untouched from the parent kernel -- turning the feature on
# by default achieves the same compiled result as editing every one of
# those cfg sites by hand, without the risk of doing that by hand across
# dozens of files.
default = ["hosted"]
hosted = ["dep:cudarc", "dep:serde_json", "dep:serde", "vox_core/hosted"]
# conventional_spectrum for membrane execution and point switches
conventional_spectrum = ["hosted", "vox_core/resident"]

[profile.dev]
panic = "abort"

[profile.release]
panic = "unwind"
lto = false

[[bin]]
name = "g-momonados"
path = "src/main.rs"

# [[bin]]
# name = "ququart_word"
# path = "src/bin/ququart_word.rs"
# required-features = ["hosted"]

[[bin]]
name = "ququart_factor"
path = "src/bin/ququart_factor.rs"
required-features = ["hosted"]

[[bin]]
name = "ququart_baked"
path = "src/bin/ququart_baked.rs"
required-features = ["hosted"]

[[bin]]
name = "ququart_factor_baked"
path = "src/bin/ququart_factor_baked.rs"
required-features = ["hosted"]

[[bin]]
name = "ququart_work_probe_baked"
path = "src/bin/ququart_work_probe_baked.rs"
required-features = ["hosted"]

[[bin]]
name = "vox_disasm_region"
path = "src/bin/vox_disasm_region.rs"
required-features = ["hosted"]

[[bin]]
name = "ququart_prepare_operator"
path = "src/bin/ququart_prepare_operator.rs"
required-features = ["hosted"]

[[bin]]
name = "resident_circuit_braid_probe"
path = "src/bin/resident_circuit_braid_probe.rs"
required-features = ["hosted"]

[[bin]]
name = "resident_frobenius_exact_probe"
path = "src/bin/resident_frobenius_exact_probe.rs"
required-features = ["hosted"]

[[bin]]
name = "anyon_generator"
path = "src/bin/anyon_generator.rs"
required-features = ["hosted"]
