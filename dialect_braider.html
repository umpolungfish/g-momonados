<title>Dialect CFG Engine</title><style>

*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#0b0b12;color:#f0ead8;font-family:'Courier New',monospace;overflow-x:hidden}
#layout{display:grid;grid-template-columns:340px 1fr;height:100vh;width:100vw}
#sidebar{background:#12101e;border-right:1px solid #2a2740;padding:16px;overflow-y:auto;display:flex;flex-direction:column;gap:4px}
#main{padding:20px;background:#0b0b12;display:grid;grid-template-columns:1fr 360px;grid-template-rows:auto auto 1fr;gap:12px;overflow:hidden}
h1{color:#e8b84b;font-size:18px;margin-bottom:2px}
h2{color:#c8b8e0;font-size:14px;margin:12px 0 6px;border-bottom:1px solid #2a2740;padding-bottom:4px;flex-shrink:0}
select{width:100%;background:#1e1c2e;color:#f0ead8;border:1px solid #3a3550;border-radius:4px;padding:6px 8px;font-family:'Courier New',monospace;font-size:12px;margin-bottom:6px}
select option{background:#1e1c2e}
select optgroup{background:#12101e;color:#8a84b0;font-style:normal}
textarea{width:100%;background:#1e1c2e;color:#f0ead8;border:1px solid #3a3550;border-radius:4px;padding:6px 8px;font-family:'Courier New',monospace;font-size:14px;height:60px;margin:4px 0;letter-spacing:2px}
.btn{background:#2A2740;color:#f0ead8;border:1px solid #3a3550;border-radius:4px;padding:5px 12px;cursor:pointer;font-size:11px;margin:2px;font-family:'Courier New',monospace}
.btn:hover{background:#3a3550;border-color:#a84bb8}
.tag{display:inline-block;padding:2px 8px;border-radius:3px;font-size:10px;margin:2px;font-weight:bold}
.tag-pass{background:#1a3a1a;color:#6f6;border:1px solid #2a5a2a}
.tag-fail{background:#3a1a1a;color:#f66;border:1px solid #5a2a2a}
.tag-par{background:#2a1a3a;color:#a8f;border:1px solid #3a2a5a}
.tag-seq{background:#1a2a3a;color:#6af;border:1px solid #2a3a5a}
.tag-info{background:#1e1c2e;color:#c8b8e0;border:1px solid #3a3550}
#ruleset-box{background:#1a1828;border:1px solid #2a2740;border-radius:6px;padding:10px;margin:10px 0;font-size:11px;line-height:1.6;color:#f0ead8;flex-shrink:0}
#ruleset-box .gr{display:flex;gap:6px;margin:2px 0}
#ruleset-box .gl{color:#8a84b0;width:24px}
#ruleset-box .gv{color:#f0ead8}
#rslt-box{background:#1a1828;border:1px solid #2a2740;border-radius:6px;padding:10px;margin:10px 0;font-size:11px;color:#f0ead8;flex-shrink:0}

#right-col{display:flex;flex-direction:column;gap:12px;overflow:hidden;grid-column:2;grid-row:3}
#cfg-box{background:#1a1828;border:1px solid #2a2740;border-radius:6px;padding:12px;font-size:11px;line-height:1.6;color:#f0ead8;flex-grow:1;overflow-y:auto}
#static-view{width:100%;height:240px;background:#0b0b12;border:1px solid #2a2740;border-radius:6px;position:relative;overflow:hidden;flex-shrink:0}
#braid-view{width:100%;height:100%;background:#0b0b12;border:1px solid #2a2740;border-radius:6px;position:relative;overflow:hidden;grid-column:1;grid-row:3}

#braid-view svg, #static-view svg{width:100%;height:100%}
.edge{stroke:#3a3550;stroke-width:1.5;fill:none}
.edge.pass{stroke:#4a8}
.edge.fail{stroke:#844;stroke-dasharray:4,3}
.edge.back{stroke:#a84bb8;stroke-dasharray:2,2}
text{font-family:'Courier New',monospace;pointer-events:none}
#legend{display:flex;gap:14px;margin:0;font-size:10px;flex-wrap:wrap;color:#8a84b0;grid-column:1 / -1;grid-row:2;align-items:center}
#legend span{display:flex;align-items:center;gap:4px}
.ld{width:10px;height:10px;border-radius:50%;display:inline-block}
#tip{position:absolute;display:none;pointer-events:none;background:rgba(11,11,18,0.96);border:1px solid #5a659c;border-radius:6px;padding:8px 12px;color:#f0ead8;font-size:11px;max-width:280px;z-index:100;line-height:1.5}
#stat-bar{display:flex;gap:12px;margin:0;font-size:11px;color:#8a84b0;flex-wrap:wrap;grid-column:1 / -1;grid-row:1}

/* Pan/Zoom cursor styling */
.pannable { cursor: grab; }
.pannable:active { cursor: grabbing; }

</style></head><body>

// Pan/Zoom state
const zoomState = {
  braid: { tx: 0, ty: 0, scale: 1, isDragging: false, startX: 0, startY: 0, startTx: 0, startTy: 0 },
  static: { tx: 0, ty: 0, scale: 1, isDragging: false, startX: 0, startY: 0, startTx: 0, startTy: 0 }
};

function applyZoom(viewId) {
  const el = document.getElementById(viewId + 'Zoom');
  if (!el) return;
  const s = zoomState[viewId];
  el.setAttribute('transform', `translate(${s.tx}, ${s.ty}) scale(${s.scale})`);
}

function setupPanZoom(id) {
  const container = document.getElementById(id + '-view');
  if (!container) return;
  const state = zoomState[id];

  container.addEventListener('wheel', (e) => {
    e.preventDefault();
    const svg = container.querySelector('svg');
    if (!svg) return;
    const vb = svg.viewBox.baseVal;
    const rect = container.getBoundingClientRect();
    
    // Fallbacks in case viewBox isn't fully set
    const vbW = vb.width || 800;
    const vbH = vb.height || 480;
    const scaleX = vbW / (container.clientWidth || 800);
    const scaleY = vbH / (container.clientHeight || 480);
    
    const mouseX = (e.clientX - rect.left) * scaleX;
    const mouseY = (e.clientY - rect.top) * scaleY;
    
    const zoomFactor = Math.exp(-e.deltaY * 0.002);
    const newScale = Math.min(Math.max(0.1, state.scale * zoomFactor), 20);
    
    // Zoom to mouse pointer
    state.tx = mouseX - (mouseX - state.tx) * (newScale / state.scale);
    state.ty = mouseY - (mouseY - state.ty) * (newScale / state.scale);
    state.scale = newScale;
    
    applyZoom(id);
  }, { passive: false });

  container.addEventListener('mousedown', (e) => {
    state.isDragging = true;
    state.startX = e.clientX;
    state.startY = e.clientY;
    state.startTx = state.tx;
    state.startTy = state.ty;
  });

  window.addEventListener('mousemove', (e) => {
    if (!state.isDragging) return;
    const svg = container.querySelector('svg');
    if (!svg) return;
    const vb = svg.viewBox.baseVal;
    const vbW = vb.width || 800;
    const vbH = vb.height || 480;
    const scaleX = vbW / (container.clientWidth || 800);
    const scaleY = vbH / (container.clientHeight || 480);
    
    state.tx = state.startTx + (e.clientX - state.startX) * scaleX;
    state.ty = state.startTy + (e.clientY - state.startY) * scaleY;
    applyZoom(id);
  });

  window.addEventListener('mouseup', () => {
    state.isDragging = false;
  });
  
  container.addEventListener('dblclick', () => {
    state.tx = 0;
    state.ty = 0;
    state.scale = 1;
    applyZoom(id);
  });
}

function getTokens() {
  const sel = document.getElementById("wordSel").value;
  let symbolSeq = "";
  if (sel === "custom") {
    symbolSeq = document.getElementById("customWord").value.trim();
  } else {
    symbolSeq = PROGRAMS[sel] || "";
  }
  const cleanSeq = symbolSeq.replace(/\s+/g, '');
  const names = [];
  for (const ch of cleanSeq) {
    if (SYM2NAME[ch]) {
      names.push(SYM2NAME[ch]);
    }
  }
  return names;
}

function validTransition(from, to) {
  if (from === "⊢") return to !== "⊣" && to !== "∋";
  if (from === "⊣") return ["⊢","⊙","≻"].includes(to);
  if (["≻","≺","⋈","⊙"].includes(from)) return true;
  if (from === "∈") return !["⊢","⊣","∈","∋"].includes(to);
  if (from === "∋") return true;
  if (["⊤","⊥","⊞"].includes(from)) return to !== "⊢";
  if (from === "⊡") return true;
  return true;
}

}

function igFromWord(tokens) {
  const n = tokens.length;
  if (n === 0) return {};
  const unique = new Set(tokens);
  const d_div = unique.size;
  const D = d_div <= 2 ? 1 : d_div <= 5 ? 2 : d_div <= 9 ? 3 : 4;
  const sr = tokens[0] === tokens[n-1];
  let fams = [0,0,0,0];
  let fsplit = false, ffuse = false;
  for (const t of tokens) {
    fams[FAM[t]]++;
    if (t === "FSPLIT") fsplit = true;
    if (t === "FFUSE") ffuse = true;
  }
  const fo = (fsplit && ffuse) ? 1 : 0;
  const dc = tokens.includes("EVALT") && tokens.includes("EVALF") && tokens.includes("ENGAGR");
  let period = n;
  for (let p = 1; p <= n; p++) {
    if (n % p === 0) {
      let ok = true;
      for (let i = p; i < n && ok; i++) {
        if (tokens[i] !== tokens[i-p]) ok = false;
      }
      if (ok) { period = p; break; }
    }
  }
  const ifix_count = tokens.filter(t => t === "IFIX").length;
  const d_val = D;
  const t_val = sr ? 5 : period === 1 ? 1 : period === 2 ? 3 : fo > 0 ? 4 : 2;
  const r_val = fo === 1 ? 4 : fo === 2 ? 3 : 2;
  const p_val = fo === 1 ? 5 : 4;
  const f_val = dc ? 3 : period === 1 ? 1 : 2;
  const k_val = ifix_count >= 8 ? 4 : period <= 2 ? 3 : period <= 4 ? 2 : 1;
  const g_val = ifix_count >= 3 ? 3 : d_div <= 3 ? 1 : 2;
  const c_val = fo > 0 ? 3 : period === 1 ? 1 : 2;
  const phi_val = sr && dc ? 2 : dc ? 4 : period === 1 ? 1 : 3;
  const h_val = period === 1 ? 1 : period === 2 ? 2 : period <= 4 ? 3 : 4;
  const s_val = d_div >= 8 ? 3 : d_div >= 4 ? 2 : 1;
  const om_val = tokens.includes("AREV") ? 3 : fsplit ? 2 : 1;
  return {D:d_val, T:t_val, R:r_val, P:p_val, F:f_val, K:k_val, G:g_val, C:c_val,
          phi:phi_val, H:h_val, S:s_val, omega:om_val,
          p:p_val, f:f_val, k:k_val, g:g_val, c:c_val, h:h_val, s:s_val, d:d_val, t:t_val, r:r_val};
}

  html += `<circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="#0072B2" stroke-width="1.4" stroke-dasharray="5 4" opacity="0.8"/>`;
  html += `<text x="${cx}" y="${cy - R - 10}" text-anchor="middle" fill="#c8b8e0" font-size="10">face-on: down the syzygy axis</text>`;
  
  const facePos = {};
  ["EVALT", "EVALF", "ENGAGR"].forEach((tok, k) => {

  const tri = ["EVALT", "EVALF", "ENGAGR"].map(k => `${facePos[k].x},${facePos[k].y}`).join(" ");

  html += `<text x="${cx}" y="${cy + R + 18}" text-anchor="middle" fill="#6f6" font-size="10">A₂ trine at 120°</text>`;

    html += `<text x="${q.x}" y="${q.y + 4}" text-anchor="middle" fill="#B8860B" font-size="14" font-weight="bold">${GLYPH[tok]}</text>`;

  svg.innerHTML = `<g id="staticZoom">${html}</g>`;
  applyZoom('static');
}

function drawBraid(tokens, ig, allPass, seq, g1p, g2p, g3p, idx) {
  const svg = document.getElementById("braidSvg");
  const n = tokens.length;

  const H = document.getElementById("braid-view").clientHeight || 480;
  svg.setAttribute("viewBox", "0 0 " + W + " " + H);

  let html = "";
  const yMid = H / 2;
  const LR = Math.min(W * 0.2, H * 0.35);

  // ── side-on ──
  const CEN = { x: W / 2, y: yMid };
  const ODOT = { x: CEN.x - LR, y: yMid - LR * 0.30 };
  const POLE = { x: CEN.x + LR, y: yMid };
  const h3 = LR * Math.sqrt(3) / 2;

  html += `<circle cx="${ODOT.x}" cy="${ODOT.y}" r="${LR}" fill="none" stroke="#B8860B" stroke-width="1.4" stroke-dasharray="5 4" opacity="0.8"/>`;
  html += `<circle cx="${CEN.x}" cy="${CEN.y}" r="${LR}" fill="none" stroke="#0072B2" stroke-width="1.4" stroke-dasharray="5 4" opacity="0.8"/>`;
  html += `<line x1="${ODOT.x}" y1="${ODOT.y}" x2="${CEN.x}" y2="${CEN.y}" stroke="#3a3550" stroke-width="1.2"/>`;
  html += `<line x1="${CEN.x}" y1="${CEN.y - h3}" x2="${CEN.x}" y2="${CEN.y + h3}" stroke="#009E73" stroke-width="1.1" opacity="0.8"/>`;
  html += `<text x="${CEN.x}" y="${yMid - LR - 30}" text-anchor="middle" fill="#c8b8e0" font-size="12">side-on: plane of the syzygy axis</text>`;
  html += `<text x="${ODOT.x}" y="${ODOT.y - LR * 0.62}" text-anchor="middle" fill="#B8860B" font-size="10">∈ shell on ⊙</text>`;
  html += `<text x="${POLE.x + LR * 0.12}" y="${yMid - LR * 0.55}" fill="#6af" font-size="10">evaluator sphere (d=2048)</text>`;
  html += `<text x="${CEN.x + 6}" y="${CEN.y - h3 - 8}" fill="#6f6" font-size="10">trine, edge-on</text>`;

  // ── the program itself ──
  const TRINE = ["EVALT", "EVALF", "ENGAGR"];
  const trinePos = {
    EVALT:  { x: CEN.x, y: CEN.y },
    EVALF:  { x: CEN.x, y: CEN.y - h3 },
    ENGAGR: { x: CEN.x, y: CEN.y + h3 },
  };
  
  const RAIL = [];
  for (let i = 0; i < n; i++) {
    const t = tokens[i];
    if (t === "IMSCRIB" || t === "FFUSE" || TRINE.includes(t)) continue;
    RAIL.push(i);
  }
  const x0 = Math.max(20, ODOT.x - LR * 1.5);
  const x1 = Math.min(W - 20, POLE.x + LR * 1.5);

  const tokCount = {};
  const pos = [];
  for (let i = 0; i < n; i++) {
    const t = tokens[i];
    const rep = (tokCount[t] = (tokCount[t] || 0) + 1) - 1;
    if (t === "IMSCRIB") {
      pos.push({ x: ODOT.x, y: ODOT.y - rep * 18 });
    } else if (t === "FFUSE") {
      pos.push({ x: POLE.x, y: POLE.y + rep * 18 });
    } else if (trinePos[t]) {
      pos.push({ x: trinePos[t].x, y: trinePos[t].y + rep * 18 });
    } else {
      const k = RAIL.indexOf(i);
      const frac = RAIL.length > 1 ? k / (RAIL.length - 1) : 0.5;
      const spacing = (x1 - x0) / Math.max(1, RAIL.length - 1);
      pos.push({ x: x0 + (x1 - x0) * frac + (rep * spacing * 0.1), y: yMid + LR * 1.5 });
    }
  }

  // Draw edges
  for (let i = 0; i < n; i++) {
    const j = (i + 1) % n;
    const p1 = pos[i], p2 = pos[j];
    const isCyclic = j === 0;
    const from_tok = tokens[i], to_tok = tokens[j];
    const valid = validTransition(GLYPH[from_tok], GLYPH[to_tok]);
    const cls = valid ? (allPass ? "pass" : "fail") : "fail";
    const edgeCls = `edge ${isCyclic ? "back" : cls}`;
    
    const mx = (p1.x + p2.x) / 2;
    const my = (p1.y + p2.y) / 2;
    const safeMy = Math.min(H - 20, Math.max(20, my));
    const ny = my < (yMid + LR * 1.5) ? my + 20 : my - 20;

    html += `<path class="${edgeCls}" d="M${p1.x},${p1.y} Q${mx},${ny} ${p2.x},${p2.y}"/>`;
    
    if (from_tok === "FSPLIT" && to_tok === "FFUSE") {
      html += `<text x="${mx}" y="${ny-6}" text-anchor="middle" fill="#c8b8e0" font-size="7">∈→∋</text>`;
    }
    if (from_tok === "FFUSE" && to_tok === "FSPLIT") {
      html += `<text x="${mx}" y="${ny-6}" text-anchor="middle" fill="#c8b8e0" font-size="7">∋→∈</text>`;
    }
  }

  // Draw token nodes
  for (let i = 0; i < n; i++) {
    const t = tokens[i];
    const p = pos[i];
    const fam = FAM[t] || 0;
    const col = FAMC[fam];
    const glyph = GLYPH[t] || t;
    const isPass = allPass;
    const r = isPass ? 15 : 11;
    html += `<g class="token-node">`;
    html += `<circle cx="${p.x}" cy="${p.y}" r="${r}" fill="none" stroke="${col}" stroke-width="${isPass ? 2.5 : 1.5}" class="token-ring" opacity="${isPass ? 1 : 0.5}"/>`;
    html += `<text x="${p.x}" y="${p.y+3}" text-anchor="middle" fill="${col}" font-size="17" font-weight="bold">${glyph}</text>`;
    html += `<text x="${p.x}" y="${p.y+r+12}" text-anchor="middle" fill="#8a84b0" font-size="8">${i}</text>`;
    html += `</g>`;
  }

  let fsplitCount = tokens.filter(t => t === "FSPLIT").length;
  let ffuseCount = tokens.filter(t => t === "FFUSE").length;
  const balanced = fsplitCount === ffuseCount;
  html += `<text x="12" y="14" fill="#8a84b0" font-size="9">∈:${fsplitCount} ∋:${ffuseCount} ${balanced ? "(balanced)" : "(unbalanced)"}</text>`;

  svg.innerHTML = `<g id="braidZoom">${html}</g>`;
  applyZoom('braid');

  const box = document.getElementById("cfg-box");
  
  const famSymbols = ["⊢⊣≻≺⋈⊙", "∈∋", "⊤⊥⊞", "⊡"];
  const families = [0,0,0,0];
  for (const t of tokens) { families[FAM[t]]++; }
  const famStr = famSymbols.map((sym, i) => `${sym}:${families[i]}`).join(" ");
  
  const seqStr = tokens.map(t => GLYPH[t]).join(" &rarr; ");
  
  box.innerHTML = `
    <div><b>Token sequence</b>:<br/>${seqStr} (cyclic)</div>
    <div style="margin-top:6px"><b>Families</b>: ${famStr}</div>
    <div><b>Token diversity</b>: ${new Set(tokens).size} / ${tokens.length}</div>
    <div><b>Brancher/Merger balance</b>: ${fsplitCount}/${ffuseCount} ${balanced ? '<span style="color:#6f6">OK</span>' : '<span style="color:#f66">MISMATCH</span>'}</div>
    <div style="margin-top:12px"><b>Gate-constrained CFG production rules:</b></div>
  `;
  const allTokens = Object.keys(GLYPH);
  let prodCount = 0;
  for (const from of allTokens) {
    const validTo = allTokens.filter(to => validTransition(GLYPH[from], GLYPH[to]));
    const fromGlyph = GLYPH[from] || from;
    const toStr = validTo.map(t => GLYPH[t] || t).join(" ");
    if (validTo.length > 0) {
      box.innerHTML += `<div style="font-size:9px;color:#8a84b0;margin-left:12px;margin-top:4px">${fromGlyph} &rarr; ${toStr}</div>`;
      prodCount += validTo.length;
    }
  }
  box.innerHTML += `<div style="margin-top:12px"><span class="tag tag-info">${prodCount} productions across ${allTokens.length} nonterminals</span></div>`;
}

window.onload = function() {
  setupPanZoom('braid');
  setupPanZoom('static');
  
  showRuleset(0);
  document.getElementById("wordSel").value = "𐑛";
  document.getElementById("customWord").style.display = "none";
  evaluate();
};
</script>
